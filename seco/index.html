  </div><p class="tiny" style="margin-top:10px">${items.length} produto(s). Só aparecem na Nova requisição os produtos ativos de categorias ativas no setor.</p>`;
}
function catCategorias(){
  const names=catNames();
  const cnt=(setor,nome,onlyActive)=>state.catalog.filter(i=>i.setor===setor&&norm(i.categoria_nome)===norm(nome)&&(!onlyActive||i.ativo)).length;
  state._catNames=names;
  return `<div class="card"><div class="card-h"><h3>Categorias × setores</h3><span class="tiny">Ligue ou desligue uma categoria em cada setor. Desligada, ela some da Nova requisição daquele setor (os produtos ficam guardados).</span></div>
    ${names.length?`<div class="tbl-wrap"><table class="tbl resp mx"><thead><tr><th>Categoria</th>${Object.values(SETORES).map(s=>`<th style="text-align:center">${s}</th>`).join('')}<th></th></tr></thead><tbody>
    ${names.map((n,idx)=>{
      const total=Object.keys(SETORES).reduce((s,k)=>s+cnt(k,n,false),0);
      return `<tr><td class="first"><b>${esc(n)}</b><div class="tiny">${total} produto(s) no total</div></td>${Object.entries(SETORES).map(([k,v])=>{const row=catRow(k,n);const on=!!row&&row.ativo;return `<td class="c" data-l="${v}"><div class="cell"><label class="sw"><input type="checkbox" ${on?'checked':''} onchange="toggleCatSetor(${idx},'${k}',this.checked,this)"><span></span></label><small>${row?`${cnt(k,n,true)} ativos`:'não criada'}</small></div></td>`;}).join('')}
      <td class="acts"><button class="btn ghost sm" onclick="renameCategoria(${idx})">${ic('edit')}Renomear</button>${total===0?`<button class="btn danger sm" onclick="deleteCategoria(${idx})" title="Excluir categoria vazia">${ic('trash')}</button>`:''}</td></tr>`;}).join('')}
    </tbody></table></div>`:emptyBox('Nenhuma categoria cadastrada.','box')}
  </div>`;
}
async function toggleCatSetor(idx,setor,on,el){
  const nome=state._catNames[idx]; const row=catRow(setor,nome);
  el.disabled=true;
  try{
    if(row){
      const {error}=await db.from('catalog_categories').update({ativo:on}).eq('id',row.id); if(error) throw error;
      await logAudit('catalog_categories',row.id,on?'ativar_categoria':'inativar_categoria',row,{...row,ativo:on});
    }else if(on){
      const ins={setor,nome,ativo:true,criado_por:state.session.user.id};
      const {data,error}=await db.from('catalog_categories').insert(ins).select('id').single(); if(error) throw error;
      await logAudit('catalog_categories',data.id,'criar_categoria',null,ins);
    }
    toast(`${nome} ${on?'ativada':'desativada'} em ${SETORES[setor]}`,'ok');
    await loadCatalog();render();
  }catch(e){toast(errMsg(e),'err');el.checked=!on;el.disabled=false;}
}
async function renameCategoria(idx){
  const old=state._catNames[idx];
  const nv=await ask({title:'Renomear categoria',msg:`O novo nome vale para todos os setores e para os produtos de "${esc(old)}". Requisições antigas mantêm o nome antigo.`,input:true,required:true,value:old,ok:'Renomear'});
  if(!nv||nv===old) return;
  if(norm(nv)!==norm(old)&&catNames().some(n=>norm(n)===norm(nv))) return toast('Já existe uma categoria com esse nome.','err');
  try{
    const rows=state.categories.filter(c=>norm(c.nome)===norm(old));
    for(const c of rows){
      const {error}=await db.from('catalog_categories').update({nome:nv}).eq('id',c.id); if(error) throw error;
      const {error:e2}=await db.from('catalog_items').update({categoria_nome:nv}).eq('category_id',c.id); if(e2) throw e2;
    }
    await logAudit('catalog_categories',rows[0]?.id||null,'renomear_categoria',{nome:old},{nome:nv});
    toast('Categoria renomeada','ok');await loadCatalog();render();
  }catch(e){toast(errMsg(e),'err');await loadCatalog();render();}
}
async function deleteCategoria(idx){
  const nome=state._catNames[idx];
  if(!await ask({title:'Excluir categoria',msg:`"${esc(nome)}" não tem produtos e será removida de todos os setores.`,ok:'Excluir',danger:true})) return;
  const rows=state.categories.filter(c=>norm(c.nome)===norm(nome));
  for(const c of rows){const {error}=await db.from('catalog_categories').delete().eq('id',c.id); if(error) return toast(error.message,'err');}
  await logAudit('catalog_categories',rows[0]?.id||null,'excluir_categoria',{nome,setores:rows.map(r=>r.setor)},null);
  toast('Categoria excluída','ok');await loadCatalog();render();
}
function openCategoria(){
  const m=openModal({size:'sm',title:'Nova categoria',sub:'Escolha em quais setores ela aparece.',
    body:`<div class="stack"><div class="fld"><label class="lbl">Nome</label><input class="inp" id="ncN" placeholder="Ex.: Hortifruti" autofocus></div>
      <div class="fld"><label class="lbl">Ativa nos setores</label><div class="grid" style="gap:8px">${Object.entries(SETORES).map(([k,v])=>`<label class="check"><input type="checkbox" value="${k}" checked>${v}</label>`).join('')}</div></div></div>`,
    foot:`<button class="btn ghost" data-x>Cancelar</button><button class="btn primary" id="ncOk">Criar categoria</button>`});
  m.el.querySelector('#ncOk').onclick=e=>busy(e.currentTarget,async()=>{
    const nome=m.el.querySelector('#ncN').value.trim();
    const setores=[...m.el.querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value);
    if(!nome) return toast('Informe o nome.','err');
    if(!setores.length) return toast('Marque ao menos um setor.','err');
    const nomeFinal=catNames().find(n=>norm(n)===norm(nome))||nome;
    try{
      for(const s of setores){
        const row=catRow(s,nomeFinal);
        if(row){ if(!row.ativo){const {error}=await db.from('catalog_categories').update({ativo:true}).eq('id',row.id); if(error) throw error;} }
        else{const {error}=await db.from('catalog_categories').insert({setor:s,nome:nomeFinal,ativo:true,criado_por:state.session.user.id}); if(error) throw error;}
      }
      await logAudit('catalog_categories',null,'criar_categoria',null,{nome:nomeFinal,setores});
      m.close(true);toast('Categoria salva','ok');state.cat.tab='categorias';await loadCatalog();render();
    }catch(err){toast(errMsg(err),'err');}
  });
}
async function ensureCategory(setor,nome){
  let row=catRow(setor,nome);
  if(row){ if(!row.ativo){const {error}=await db.from('catalog_categories').update({ativo:true}).eq('id',row.id); if(error) throw error; row.ativo=true;} return row; }
  const {data,error}=await db.from('catalog_categories').insert({setor,nome,ativo:true,criado_por:state.session.user.id}).select('id,setor,nome,ativo').single();
  if(error) throw error; state.categories.push(data); return data;
}
function openProduto(id){
  const it=id?state.catalog.find(x=>x.id===id):null;
  const names=catNames();
  const unOpts=[...new Set([...UNIDADES,...state.catalog.map(i=>i.unidade)])].sort();
  const body=`<div class="stack">
    <div class="fld"><label class="lbl">Nome do produto</label><input class="inp" id="pN" value="${esc(it?.nome||'')}" placeholder="Ex.: Copo descartável 300 ml" autofocus></div>
    <div class="grid g2">
      <div class="fld"><label class="lbl">Categoria</label><select class="inp" id="pC">${it?'':'<option value="">Selecione a categoria…</option>'}${names.map(n=>`<option ${it&&norm(it.categoria_nome)===norm(n)?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
      <div class="fld"><label class="lbl">Unidade</label><input class="inp" id="pU" list="unList" value="${esc(it?.unidade||'und')}"><datalist id="unList">${unOpts.map(u=>`<option value="${esc(u)}">`).join('')}</datalist></div>
    </div>
    ${it?`<div class="fld"><label class="lbl">Setor</label><input class="inp" value="${esc(SETORES[it.setor])}" readonly><span class="hint">Para disponibilizar em outro setor, use "Copiar para outro setor".</span></div>
      <label class="check"><input type="checkbox" id="pA" ${it.ativo?'checked':''}>Produto ativo</label>`
    :`<div class="fld"><label class="lbl">Disponível nos setores</label><div class="grid" style="gap:8px">${Object.entries(SETORES).map(([k,v])=>`<label class="check"><input type="checkbox" value="${k}" ${state.cat.setor===k||(!state.cat.setor&&k==='cozinha')?'checked':''}>${v}</label>`).join('')}</div><span class="hint">Se a categoria ainda não existir num setor marcado, ela é criada e ativada lá.</span></div>`}
  </div>`;
  const foot=it
    ?`<button class="btn danger" id="pDel" style="margin-right:auto">${ic('trash')}Excluir</button><button class="btn ghost" id="pCopy">Copiar para outro setor</button><button class="btn primary" id="pOk">Salvar</button>`
    :`<button class="btn ghost" data-x>Cancelar</button><button class="btn primary" id="pOk">Cadastrar produto</button>`;
  const m=openModal({size:'md',title:it?'Editar produto':'Novo produto',sub:it?`${esc(SETORES[it.setor])} · ${esc(it.categoria_nome)}`:'',body,foot});
  const val=()=>({nome:m.el.querySelector('#pN').value.trim(),cat:m.el.querySelector('#pC').value,un:m.el.querySelector('#pU').value.trim()||'und'});
  m.el.querySelector('#pOk').onclick=e=>busy(e.currentTarget,async()=>{
    const v=val(); if(!v.nome) return toast('Informe o nome do produto.','err'); if(!v.cat) return toast(names.length?'Selecione a categoria.':'Crie uma categoria antes.','err');
    try{
      if(it){
        if(state.catalog.some(x=>x.id!==it.id&&x.setor===it.setor&&norm(x.nome)===norm(v.nome))) return toast('Já existe um produto com esse nome neste setor.','err');
        const c=await ensureCategory(it.setor,v.cat);
        const patch={nome:v.nome,unidade:v.un,category_id:c.id,categoria_nome:c.nome,ativo:m.el.querySelector('#pA').checked};
        const {error}=await db.from('catalog_items').update(patch).eq('id',it.id); if(error) throw error;
        await logAudit('catalog_items',it.id,'editar_item',it,{...it,...patch});
        toast('Produto salvo','ok');
      }else{
        const setores=[...m.el.querySelectorAll('.check input:checked')].map(i=>i.value);
        if(!setores.length) return toast('Marque ao menos um setor.','err');
        const dup=setores.filter(s=>state.catalog.some(x=>x.setor===s&&norm(x.nome)===norm(v.nome)));
        if(dup.length) return toast(`Já existe "${v.nome}" em ${dup.map(s=>SETORES[s]).join(', ')}.`,'err');
        for(const s of setores){
          const c=await ensureCategory(s,v.cat);
          const row={category_id:c.id,setor:s,categoria_nome:c.nome,nome:v.nome,unidade:v.un,ativo:true,criado_por:state.session.user.id};
          const {data,error}=await db.from('catalog_items').insert(row).select('id').single(); if(error) throw error;
          await logAudit('catalog_items',data.id,'criar_item',null,row);
        }
        toast(`Produto cadastrado em ${setores.length} setor(es)`,'ok');
      }
      m.close(true);await loadCatalog();render();
    }catch(err){toast(errMsg(err),'err');}
  });
  if(it){
    m.el.querySelector('#pCopy').onclick=async()=>{
      const outros=Object.keys(SETORES).filter(s=>s!==it.setor&&!state.catalog.some(x=>x.setor===s&&norm(x.nome)===norm(it.nome)));
      if(!outros.length) return toast('Este produto já existe em todos os setores.','err');
      const mm=openModal({size:'sm',title:'Copiar para outro setor',sub:esc(it.nome),
        body:`<div class="grid" style="gap:8px">${outros.map(s=>`<label class="check"><input type="checkbox" value="${s}">${SETORES[s]}</label>`).join('')}</div>`,
        foot:`<button class="btn ghost" data-x>Cancelar</button><button class="btn primary" id="cpOk">Copiar</button>`});
      mm.el.querySelector('#cpOk').onclick=e=>busy(e.currentTarget,async()=>{
        const ss=[...mm.el.querySelectorAll('input:checked')].map(i=>i.value); if(!ss.length) return toast('Marque um setor.','err');
        try{
          for(const s of ss){const c=await ensureCategory(s,it.categoria_nome);const row={category_id:c.id,setor:s,categoria_nome:c.nome,nome:it.nome,unidade:it.unidade,ativo:true,criado_por:state.session.user.id};const {data,error}=await db.from('catalog_items').insert(row).select('id').single();if(error) throw error;await logAudit('catalog_items',data.id,'criar_item',null,row);}
          closeAllModals();toast('Produto copiado','ok');await loadCatalog();render();
        }catch(err){toast(errMsg(err),'err');}
      });
    };
    m.el.querySelector('#pDel').onclick=async()=>{
      if(!await ask({title:'Excluir produto',msg:`Excluir "${esc(it.nome)}" (${SETORES[it.setor]})? Se ele já foi usado em requisições, não dá para excluir — inative em vez disso.`,ok:'Excluir',danger:true})) return;
      const {error}=await db.from('catalog_items').delete().eq('id',it.id);
      if(error) return toast(/foreign key|violates/i.test(error.message)?'Este produto já tem requisições. Inative-o em vez de excluir.':error.message,'err');
      await logAudit('catalog_items',it.id,'excluir_item',it,null);
      closeAllModals();toast('Produto excluído','ok');await loadCatalog();render();
    };
  }
}
async function toggleItem(id,ativo,el){
  const it=state.catalog.find(x=>x.id===id); el.disabled=true;
  const {error}=await db.from('catalog_items').update({ativo}).eq('id',id);
  if(error){el.checked=!ativo;el.disabled=false;return toast(error.message,'err');}
  await logAudit('catalog_items',id,ativo?'ativar_item':'inativar_item',it,{...it,ativo});
  it.ativo=ativo;toast(`${it.nome} ${ativo?'ativado':'inativado'}`,'ok');render();
}
Object.assign(window,{toggleCatSetor,renameCategoria,deleteCategoria,openCategoria,openProduto,toggleItem});

async function statusUsuario(id,ativo,btn){
  const u=state.users.find(x=>x.id===id);
  if(!await ask({title:ativo?'Ativar login':'Inativar login',msg:ativo?`${esc(u.nome)} volta a conseguir entrar no sistema.`:`${esc(u.nome)} não vai conseguir entrar nem acessar dados. O histórico de requisições é mantido.`,ok:ativo?'Ativar':'Inativar',danger:!ativo})) return;
  try{await adminFn({acao:'status',user_id:id,ativo});toast(ativo?'Login ativado':'Login inativado','ok');await loadUsers();render();}catch(err){toast(errMsg(err),'err');}
}
Object.assign(window,{openUsuario,senhaUsuario,statusUsuario});

/* =====================================================================
   AUDITORIA (ADM)
   ===================================================================== */
const ACAO_L={criar:'Criou requisição',marcar_separando:'Marcou separando',confirmar_entrega:'Confirmou entrega',alterar_entrega:'Alterou entrega',cancelar:'Cancelou',reabrir:'Reabriu',mover_lixeira:'Moveu p/ lixeira',restaurar_lixeira:'Restaurou',excluir_definitivo:'Excluiu definitivo',criar_item:'Criou produto',editar_item:'Editou produto',ativar_item:'Ativou produto',inativar_item:'Inativou produto',excluir_item:'Excluiu produto',criar_categoria:'Criou categoria',ativar_categoria:'Ativou categoria',inativar_categoria:'Inativou categoria',renomear_categoria:'Renomeou categoria',excluir_categoria:'Excluiu categoria',criar_usuario:'Criou login',editar_usuario:'Editou login',redefinir_senha:'Redefiniu senha',ativar_usuario:'Ativou login',inativar_usuario:'Inativou login',bloquear_usuario:'Bloqueou login',desbloquear_usuario:'Desbloqueou login'};
VIEWS.auditoria=function(){
  const a=state.aud, q=norm(a.q);
  const tabs=`<div class="seg"><button class="${a.tab==='acoes'?'on':''}" onclick="state.aud.tab='acoes';render()">${ic('log')}Ações</button><button class="${a.tab==='acessos'?'on':''}" onclick="state.aud.tab='acessos';render()">${ic('out')}Acessos</button></div>`;
  let body;
  if(a.tab==='acoes'){
    const logs=state.audit.filter(l=>!q||norm((l.usuario_nome||'')+' '+(ACAO_L[l.acao]||l.acao)+' '+l.tabela+' '+(l.justificativa||'')).includes(q));
    body=logs.length?`<div class="tbl-wrap"><table class="tbl resp"><thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Área</th><th>Justificativa</th></tr></thead><tbody>${logs.map(l=>`<tr><td class="first tiny">${fmtDT(l.criado_em)}</td><td data-l="Usuário"><b>${esc(l.usuario_nome||'—')}</b> <span class="tiny">${esc(ROLES[l.usuario_role]||'')}</span></td><td data-l="Ação">${esc(ACAO_L[l.acao]||l.acao)}</td><td data-l="Área" class="tiny">${esc(l.tabela)}</td><td data-l="Justificativa">${esc(l.justificativa||'—')}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('Nenhum registro.','shield');
  }else{
    const logs=state.logins.filter(l=>!q||norm(l.email+' '+(l.perfil||'')+' '+(l.setor||'')).includes(q));
    body=logs.length?`<div class="tbl-wrap"><table class="tbl resp"><thead><tr><th>Quando</th><th>Login</th><th>Perfil</th><th>Setor</th><th>Dispositivo</th></tr></thead><tbody>${logs.map(l=>`<tr><td class="first tiny">${fmtDT(l.criado_em)}</td><td data-l="Login"><b>${esc(l.email||'—')}</b></td><td data-l="Perfil">${esc(ROLES[l.perfil]||l.perfil||'—')}</td><td data-l="Setor">${l.setor?SETORES[l.setor]:'—'}</td><td data-l="Dispositivo" class="tiny">${/mobile|android|iphone/i.test(l.user_agent||'')?'Celular':'Computador'}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('Nenhum acesso registrado.','out');
  }
  return pageHead('Auditoria','Quem fez o quê, e quando',`<button class="btn ghost" onclick="routeLoad()">${ic('refresh')}Atualizar</button>`)+
    `<div style="margin-bottom:14px">${tabs}</div><div class="card"><div class="toolbar"><div class="inp-ic">${ic('search')}<input class="inp" data-k="aq" placeholder="Buscar usuário, ação, justificativa…" value="${esc(a.q)}" oninput="typed(()=>state.aud.q=this.value)"></div></div>${body}</div>
    <p class="tiny" style="margin-top:10px">Mostrando os registros mais recentes (até 400 ações e 300 acessos).</p>`;
};

/* =====================================================================
   INÍCIO
   ===================================================================== */
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await startSession(session); else location.replace(PORTAL);
  sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(()=>{
    if(ev==='SIGNED_OUT'||!sess){if(state.profile){resetState();renderLogin();}return;}
    if(ev==='SIGNED_IN'&&state.profile?.id!==sess.user.id){startSession(sess);return;}
    state.session=sess;
  },0);});
}
init().catch(e=>{console.error(e);renderLogin('Não foi possível conectar. Verifique a internet e recarregue.');});
</script>
